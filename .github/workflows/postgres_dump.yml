name: Supabase Disaster Recovery Backup

on:
  schedule:
    # Executa diariamente às 03:00 UTC
    - cron: '0 15 * * 2,4'
  workflow_dispatch: # Permite execução manual pelo painel de Actions

permissions:
  contents: write

jobs:
  disaster_recovery_dump:
    name: Backup & Auto-Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install PostgreSQL 17 Client
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Run pg_dump (Custom Format)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_POOLER }}
        run: |
          mkdir -p supabase/backups/postgres_dump

          /usr/lib/postgresql/17/bin/pg_dump --dbname="$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --exclude-schema='extensions|graphql|graphql_public|net|pgbouncer|pgsodium|pgsodium_masks|realtime|supabase_functions|supabase_migrations|vault' \
            --file=supabase/backups/postgres_dump/backup.dump

      - name: Commit & Push Backup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(db): update disaster recovery dump [skip ci]"
          file_pattern: "supabase/backups/postgres_dump/backup.dump"
